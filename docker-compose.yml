services:
  web:
    build:
      context: ..
      dockerfile: dockerfile
    
    container_name: games_app
    
    ports:
      - "8000:8000"

    environment:
      POSTGRES_DB: stemshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 11122008
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./media:/app/media

    restart: unless-stopped

  db:
    image: postgres:18
    container_name: stemshop_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stemshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 11122008
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stemshop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
