

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Stem Shop{% endblock %}</title>

    {% load static %}

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>

<body>

    
    <nav class="navbar bg-dark navbar-dark">
        <div class="container">

            
            <a href="{% url 'game_list' %}" class="navbar-brand fw-bold">
                🎮 Stem Game List
            </a>

            
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            
            <div class="collapse navbar-collapse" id="mainNavbar">

                
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a href="{% url 'game_list' %}" class="nav-link">
                            🎮 Games
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="{% url 'about' %}" class="nav-link">
                            ℹ️ About
                        </a>
                    </li>
                    <li class="nav-item">
                        {% if user.is_superuser %}
                            <a href="{% url 'game_add' %}" class="btn btn-primary">Add Game</a>
                        {% endif %}
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'cart' %}" class="nav-link">
                            🛒 Cart ({{ request.session.cart|length|default:'0' }})
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="{% url 'login' %}" class="btn btn-primary ms-lg-2 mt-2 mt-lg-0">
                            Login
                        </a>
                    </li>
                </ul>

            </div>
        </div>
    </nav>


    <!-- MAIN CONTENT -->
    <main class="container py-4">

        {% block content %}
        {% endblock %}

    </main>


    <!-- FOOTER -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">

            <p class="mb-2">
                © Stem Shop. Purely for project.
            </p>

        </div>
    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>

</body>
</html>
